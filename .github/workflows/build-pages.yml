name: Build Github Pages
# Triggers:
#   - push to main under docs/** (docs source changed)
#   - manual dispatch
#   - the release workflow ("Publish Release") dispatches this explicitly as its
#     final step (`gh workflow run build-pages.yml`) so the site rebuilds after a release.
#
# There is intentionally NO `workflow_run` trigger on "Publish Release". The release
# workflow is started via workflow_dispatch from the release scripts, and in CI that
# dispatch runs under GITHUB_TOKEN. Runs initiated by GITHUB_TOKEN do not cascade to
# `workflow_run` triggers, so such a trigger would never fire. The explicit dispatch
# from the release workflow is used instead (workflow_dispatch is exempt from that guard).
on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild both channels even when their caches are current
        type: boolean
        default: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout scripts from main branch
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- ./workflow-scripts
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install script deps
        run: npm ci
        working-directory: ./workflow-scripts
      - name: Restore public docs cache
        uses: actions/cache@v5
        with:
          path: ./cache/public
          key: docs-public-${{ github.run_id }}
          restore-keys: docs-public-
      - name: Restore catalyst docs cache
        uses: actions/cache@v5
        with:
          path: ./cache/catalyst
          key: docs-catalyst-${{ github.run_id }}
          restore-keys: docs-catalyst-
      # Two runs died inside Astro's `Building static entrypoints` -- the Rollup SSR bundle over
      # ~1700 generated pages, the memory peak of the build -- with nothing to show for it but
      # "The runner has received a shutdown signal": no exit code, no V8 `heap out of memory`.
      # That silence is the diagnosis. V8's default heap ceiling sits at or above the VM's physical
      # memory, so the kernel OOM-kills the runner agent before node can report a heap limit.
      #
      # Capping the heap below physical memory turns that into an outcome that can be read: either
      # V8 collects hard enough to finish, or it fails with a heap error naming the cause. The
      # sampler writes to the step's stdout, which streams to the live log, so the last memory
      # reading before a VM death survives the death.
      - name: Build docs
        run: |
          echo "CPUs: $(nproc)"
          free -m
          df -h /
          TOTAL_MEMORY_IN_MB=$(free -m | awk '/^Mem:/ { print $2 }')
          export NODE_OPTIONS="--max-old-space-size=$((TOTAL_MEMORY_IN_MB * 3 / 4))"
          echo "NODE_OPTIONS=$NODE_OPTIONS"
          while true; do
            sleep 10
            echo "[mem] $(free -m | awk '/^Mem:/ { print $3 " / " $2 " MB used" }')"
          done &
          MEMORY_SAMPLER_PID=$!
          trap 'kill "$MEMORY_SAMPLER_PID" 2>/dev/null || true' EXIT
          npx -y jiti ./workflow-scripts/build-pages.ts
        env:
          OUTPUT_DIR: ./site
          CACHE_DIR: ./cache
          FORCE: ${{ inputs.force }}
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
