name: Check Obsidian Package Update
on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, which is what this effectively ran at anyway. GitHub gives `schedule` the
    # lowest-priority queue and delays or drops it under load: with an hourly cron only ~7-18 of 24
    # runs actually landed per day, arriving 24 minutes to 2h50m late and never on the hour. Twice
    # a queued job waited 15 minutes for a hosted runner, never got one, and was cancelled -- red
    # marks for work that was never needed, since this check is idempotent and the next run catches
    # up. Asking for less costs no real detection latency and removes two thirds of that exposure.
    - cron: '0 */3 * * *'
jobs:
  check-obsidian-package-update:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout scripts from main branch
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- ./workflow-scripts
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install script deps
        run: npm ci
        working-directory: ./workflow-scripts
      - name: Run script
        id: run-script
        run: npx -y jiti ./workflow-scripts/check-obsidian-package-update.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
