name: Publish Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) that holds the release to publish.
        required: true
        type: string
      isBeta:
        description: Whether to publish as a beta prerelease.
        required: false
        default: false
        type: boolean
jobs:
  publish-release:
    permissions:
      actions: write
      contents: write
      # Mints the OIDC token that npm trusted publishing exchanges for a short-lived, workflow-scoped
      # publish credential. Without it `npm publish` falls back to looking for a token and fails.
      id-token: write
      # Closes the branch's "Publish the first release of ..." issue once its package is on npm.
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Checkout scripts from main branch
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- ./workflow-scripts
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install script deps
        run: npm ci
        working-directory: ./workflow-scripts
      - name: Run script
        id: run-script
        run: npx -y jiti ./workflow-scripts/publish-release.ts
        env:
          # No NODE_AUTH_TOKEN: publishing authenticates through trusted publishing (OIDC), so there is no
          # long-lived npm credential in this repo at all. Every package published from here must have a
          # trusted publisher configured on npmjs.com pointing at this workflow file -- see AGENTS.md.
          IS_BETA: ${{ inputs.isBeta }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        # Runs whenever the script got as far as pushing the tag, even if a later part of it failed. The script
        # sets `tagName` the moment the tag is on the remote, so a tag never goes without its release: on
        # 2026-10-16 a wrapper publish failing after the push skipped this step, and
        # `obsidian-public-1.14.4-v1.9.0` was published and tagged with no release. The job still ends red.
        if: ${{ !cancelled() && steps.run-script.outputs.tagName != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ steps.run-script.outputs.zipFileName }}
            dist/obsidian-typings.api.json
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.run-script.outputs.isBeta == 'true' }}
          tag_name: ${{ steps.run-script.outputs.tagName }}
          # The release branch the tag is on. Without it the action falls back to the default branch, and the
          # release page reported `main` for a tag no commit on `main` carries.
          target_commitish: ${{ steps.run-script.outputs.targetCommitish }}
          name: ${{ steps.run-script.outputs.releaseName }}
          # The same section `publish-release.ts` prepended to this release's `CHANGELOG.md`. Every release
          # body before 2026-09-23 was empty -- the action defaults to one, and nothing here overrode it --
          # so the releases page recorded which versions existed and nothing about what changed in them.
          body_path: ${{ steps.run-script.outputs.releaseNotesFileName }}
      - name: Trigger GitHub Pages build
        if: ${{ !cancelled() && steps.run-script.outputs.tagName != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-pages.yml --ref main
