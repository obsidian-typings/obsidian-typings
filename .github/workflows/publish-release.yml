name: Publish Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) that holds the release to publish.
        required: true
        type: string
      isBeta:
        description: Whether to publish as a beta prerelease.
        required: false
        default: false
        type: boolean
jobs:
  publish-release:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Checkout scripts from main branch
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- ./workflow-scripts
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install script deps
        run: npm ci
        working-directory: ./workflow-scripts
      - name: Run script
        id: run-script
        run: npx -y jiti ./workflow-scripts/publish-release.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_BETA: ${{ inputs.isBeta }}
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ steps.run-script.outputs.zipFileName }}
            dist/obsidian-typings.api.json
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.run-script.outputs.isBeta == 'true' }}
          tag_name: ${{ steps.run-script.outputs.tagName }}
          name: ${{ steps.run-script.outputs.releaseName }}
      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-pages.yml --ref main
